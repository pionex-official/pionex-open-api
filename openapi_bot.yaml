          description: Estimated total reduction amount
        reduceInvestment:
          type: string
          description: Estimated investment to be returned
        reduceGridprofit:
          type: string
          description: Estimated grid profit to be returned
        reducePnl:
          type: string
          description: Estimated PnL from reduction
        reduceFee:
          type: string
          description: Estimated fee for reduction
        estimateLiquidationPriceUp:
          type: string
          description: Current upward liquidation price
        estimateLiquidationPriceDown:
          type: string
          description: Current downward liquidation price
        estimateLiquidationPriceUpAfter:
          type: string
          description: Upward liquidation price after reduction
        estimateLiquidationPriceDownAfter:
          type: string
          description: Downward liquidation price after reduction
        estimateDeltaPosition:
          type: string
          description: Estimated position change
        estimateDeltaProfit:
          type: string
          description: Estimated profit/loss from position change
        slippage:
          type: string
          description: Recommended slippage

    FuturesGridPauseCheckRequest:
      type: object
      required: [buOrderId, mode]
      properties:
        buOrderId:
          type: string
          description: Bot order ID
        mode:
          type: string
          enum: [immediate, conditional]
          description: "Pause mode: `immediate` = pause now; `conditional` = pause on trigger price"
        triggerPausePriceUp:
          type: string
          description: Upward trigger price (when mode=conditional). Optional; set either direction or both.
        triggerPausePriceDown:
          type: string
          description: Downward trigger price (when mode=conditional). Optional.

    FuturesGridPauseCheckResponse:
      type: object
      description: Pause check result with estimate data
      properties:
        checkResult:
          type: boolean
          description: Whether the order can be paused
        reason:
          type: string
          description: "Failure reason when checkResult is false (fixed constant, e.g. FORBIDDEN_COPY_BOT_SUBORDER / FORBIDDEN_FULLY_HEDGING / ORDER_NOT_RUNNING)"
        estimateLiquidationPriceUp:
          type: string
          description: Current upward liquidation price
        estimateLiquidationPriceDown:
          type: string
          description: Current downward liquidation price
        estimateLiquidationPriceUpAfterTriggerUp:
          type: string
          description: Returned when triggerPausePriceUp is set — upward liquidation price after the upward pause triggers
        estimateLiquidationPriceDownAfterTriggerUp:
          type: string
          description: Returned when triggerPausePriceUp is set — downward liquidation price after the upward pause triggers
        estimateLiquidationPriceUpAfterTriggerDown:
          type: string
          description: Returned when triggerPausePriceDown is set — upward liquidation price after the downward pause triggers
        estimateLiquidationPriceDownAfterTriggerDown:
          type: string
          description: Returned when triggerPausePriceDown is set — downward liquidation price after the downward pause triggers

    FuturesGridPauseRequest:
      type: object
      required: [buOrderId, mode]
      properties:
        buOrderId:
          type: string
          description: Bot order ID
        mode:
          type: string
          enum: [immediate, conditional]
          description: "Pause mode: `immediate` = pause now (backend uses live market price, not client-supplied); `conditional` = pause on trigger price"
        stopProfitEnabled:
          type: boolean
          description: Whether to keep take-profit active while paused
        stopLossEnabled:
          type: boolean
          description: Whether to keep stop-loss active while paused
        triggerPausePriceUp:
          type: string
          description: Upward trigger price. Set either direction or both.
        triggerPausePriceDown:
          type: string
          description: Downward trigger price.

    FuturesGridPauseResponse:
      type: object
      description: Pause execution result (no status field; processed asynchronously)
      properties:
        stopLossEnabled:
          type: boolean
          description: Effective stop-loss retention state
        stopProfitEnabled:
          type: boolean
          description: Effective take-profit retention state
        triggerPausePriceUp:
          type: string
          description: Effective upward trigger price
        triggerPausePriceDown:
          type: string
          description: Effective downward trigger price

    FuturesGridResumeRequest:
      type: object
      required: [buOrderId]
      properties:
        buOrderId:
          type: string
          description: Bot order ID

    FuturesGridResumeCheckResponse:
      type: object
      description: Resume check result with estimate data
      properties:
        checkResult:
          type: boolean
          description: Whether the order can be resumed
        reason:
          type: string
          description: "Failure reason when checkResult is false (fixed constant, e.g. FORBIDDEN_COPY_BOT_SUBORDER / FORBIDDEN_FULLY_HEDGING / ORDER_NOT_PAUSED)"
        estimateLiquidationPriceUp:
          type: string
          description: Estimated upward liquidation price after resuming
        estimateLiquidationPriceDown:
          type: string
          description: Estimated downward liquidation price after resuming

    FuturesGridResumeResponse:
      type: object
      description: Resume execution result
      properties:
        code:
          type: integer
          format: int32
          description: RPC return code
        message:
          type: string
          description: RPC return message

    FuturesGridMarginCheckRequest:
      type: object
      required: [buOrderId, amount]
      description: Shared by addMarginCheck and reduceMarginCheck; the direction is determined by the route, not a request field.
      properties:
        buOrderId:
          type: string
          description: Bot order ID
        amount:
          type: number
          description: Margin amount to add / reduce (decimal, serialized as an unquoted number)

    FuturesGridMarginCheckResponse:
      type: object
