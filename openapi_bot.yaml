openapi: 3.0.3
info:
  title: Pionex Bot Open API
  description: |
    Pionex cryptocurrency exchange Bot RESTful API - Bot Order List & Futures Grid Bot & Spot Grid Bot endpoints.

    # General Info

    ## Basic Info

    **Base URL:** `https://api.pionex.com`

    **Request Format:**
    - For private requests, the `timestamp` parameter (in milliseconds) must be included in the query string. The timestamp is valid within a range of +/-20 seconds.
    - Private requests require `PIONEX-KEY` (API Key) and `PIONEX-SIGNATURE` headers.
    - GET requests: additional parameters are passed in the query string.
    - POST/DELETE requests: parameters are passed in the request body as JSON (`application/json`).
    - Zero-valued number parameters are disregarded. 

    **Signature Construction:**
    - GET: `METHOD + PATH_URL + QUERY + TIMESTAMP`
    - POST/DELETE: `METHOD + PATH_URL + QUERY + TIMESTAMP + body`

    **Response Format:**

    All responses are JSON objects containing:
    - `result` (boolean): success indicator
    - `timestamp` (number): response timestamp in milliseconds
    - On success: `data` object with business information
    - On failure: `code` (string) and `message` (string) with error details

    Success example:
    ```json
    {"result": true, "data": {"buOrderId": "123456789"}, "timestamp": 1566691672311}
    ```

    Failure example:
    ```json
    {"result": false, "code": "PARAMETER_ERROR", "message": "Invalid parameter", "timestamp": 1566691672311}
    ```

    ## Rate Limits

    - Each endpoint has a weight value that determines how many requests it counts toward the limit.
    - IP-based and account-based limits operate independently.
    - All endpoints share the 10 per second limit based on IP.
    - Private endpoints share the 10 per second limit based on ACCOUNT.
    - Exceeding the weight limit results in HTTP 429 status code.

    ## Authentication

    [API Key Guide](https://www.pionex.com/docs/api-docs/references/api-key-guide)

    Private endpoints require HMAC SHA256 signature authentication.

    **Required headers:**
    - `PIONEX-KEY`: Your API Key
    - `PIONEX-SIGNATURE`: HMAC SHA256 hex signature

    **Required query parameter:**
    - `timestamp`: Current time in milliseconds (valid within +/-20 seconds)

    ### API Key Permissions

    Each API Key can be configured with **Bot reading**, **Bot trading**, and/or **Enable reading** permissions. Make sure your API Key has the appropriate permission enabled before calling the following endpoints.

    **Endpoints requiring `Bot reading` permission:**
    - `GET /api/v1/bot/orders` — Get bot order list
    - `GET /api/v1/bot/orders/futuresGrid/order` — Get futures grid order
    - `GET /api/v1/bot/orders/spotGrid/order` — Get spot grid order
    - `GET /api/v1/bot/orders/spotGrid/aiStrategy` — Get spot grid AI strategy
    - `POST /api/v1/bot/orders/futuresGrid/checkParams` — Check futures grid parameters
    - `POST /api/v1/bot/orders/futuresGrid/adjustParamsCheck` — Check futures grid adjust parameters (dry-run)
    - `POST /api/v1/bot/orders/futuresGrid/reduceCheck` — Check futures grid reduce (dry-run)
    - `POST /api/v1/bot/orders/spotGrid/checkParams` — Check spot grid parameters
    - `POST /api/v1/bot/orders/smartCopy/checkParams` — Check smart copy parameters
    - `GET /api/v1/bot/orders/smartCopy/order` — Get smart copy order
    - `GET /api/v1/bot/signal/userSignal` — List user custom signals
    - `GET /api/v1/bot/signal/userSignal/detail` — Get user custom signal detail

    **Endpoints requiring `Enable reading` permission:**
    - `POST /api/v1/bot/signal/listener` — Push custom trading signal

    **Endpoints requiring `Bot trading` permission:**
    - `POST /api/v1/bot/signal/userSignal` — Create user custom signal
    - `POST /api/v1/bot/signal/userSignal/edit` — Edit user custom signal
    - `DELETE /api/v1/bot/signal/userSignal/delete` — Delete user custom signal
    - `POST /api/v1/bot/orders/futuresGrid/create` — Create futures grid order
    - `POST /api/v1/bot/orders/futuresGrid/adjustParams` — Adjust futures grid (add investment / modify range)
    - `POST /api/v1/bot/orders/futuresGrid/reduce` — Reduce futures grid position
    - `POST /api/v1/bot/orders/futuresGrid/cancel` — Cancel futures grid order
    - `POST /api/v1/bot/orders/futuresGrid/pauseCheck` — Check futures grid pause (dry-run)
    - `POST /api/v1/bot/orders/futuresGrid/pause` — Pause futures grid order
    - `POST /api/v1/bot/orders/futuresGrid/resumeCheck` — Check futures grid resume (dry-run)
    - `POST /api/v1/bot/orders/futuresGrid/resume` — Resume futures grid order
    - `POST /api/v1/bot/orders/futuresGrid/addMarginCheck` — Check futures grid add margin (dry-run)
    - `POST /api/v1/bot/orders/futuresGrid/addMargin` — Add margin to futures grid order
    - `POST /api/v1/bot/orders/futuresGrid/reduceMarginCheck` — Check futures grid reduce margin (dry-run)
    - `POST /api/v1/bot/orders/futuresGrid/reduceMargin` — Reduce margin of futures grid order
    - `POST /api/v1/bot/orders/futuresGrid/updateTriggerProfitLoss` — Set / update / clear take-profit & stop-loss of a running futures grid order
    - `POST /api/v1/bot/orders/spotGrid/create` — Create spot grid order
    - `POST /api/v1/bot/orders/spotGrid/adjustParams` — Adjust spot grid parameters
    - `POST /api/v1/bot/orders/spotGrid/investIn` — Add investment to spot grid
    - `POST /api/v1/bot/orders/spotGrid/cancel` — Cancel spot grid order
    - `POST /api/v1/bot/orders/spotGrid/profit` — Extract profit from spot grid
    - `POST /api/v1/bot/orders/smartCopy/create` — Create smart copy order
    - `POST /api/v1/bot/orders/smartCopy/cancel` — Cancel smart copy order
  version: 1.0.0
  contact:
    name: Pionex API Support
    url: https://t.me/pionexapi

servers:
  - url: https://api.pionex.com
    description: Production

security: []

tags:
  - name: Bot Orders
    description: Bot order list query (private)
  - name: Futures Grid
    description: Futures Grid Bot management (private)
  - name: Spot Grid
    description: Spot Grid Bot management (private)
  - name: Smart Copy
    description: Smart Copy Bot management (private)
  - name: Signal
    description: Custom signal listener and user-defined signal management (private)
  - name: KOL
    description: KOL data endpoints (private)

paths:
  /api/v1/bot/orders:
    get:
      tags: [Bot Orders]
      summary: Get bot order list
      description: "Query bot order list with optional filters by order type, status, and trading pair. Supports pagination. Weight: 1."
      operationId: getBotOrders
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - name: status
          in: query
          description: |
            Order status filter:
            `running` - Running orders (default),
            `finished` - Closed/cancelled orders
          schema:
            type: string
            default: running
        - name: base
          in: query
          description: Base currency filter (e.g. BTC)
          schema:
            type: string
        - name: quote
          in: query
          description: Quote currency filter (e.g. USDT)
          schema:
            type: string
        - name: pageToken
          in: query
          description: Pagination token (from `nextPageToken` or `previousPageToken` in response)
          schema:
            type: string
        - name: buOrderTypes
          in: query
          description: |
            Order type filter. Can pass multiple values. If omitted, returns all types.
            Supported values: `futures_grid`, `spot_grid`, `smart_copy`.
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BotOrderListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/order:
    get:
      tags: [Futures Grid]
      summary: Get futures grid order
      description: "Query a futures grid bot order by ID. Weight: 1."
      operationId: getFuturesGridOrder
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - name: buOrderId
          in: query
          required: true
          description: Bot order ID
          schema:
            type: string
        - name: lang
          in: query
          description: Language
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FuturesGridOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/create:
    post:
      tags: [Futures Grid]
      summary: Create futures grid order
      description: "Create a new futures grid bot order. Weight: 1."
      operationId: createFuturesGridOrder
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFuturesGridRequest'
      responses:
        '200':
          description: Order created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          buOrderData:
                            type: object
                            description: Bot order data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/checkParams:
    post:
      tags: [Futures Grid]
      summary: Check futures grid parameters
      description: |
        Validate futures grid bot creation parameters and estimate investment values without creating an order. Weight: 1.

        Pass a positive `quote_investment` to receive full estimate fields.
        The current market price is fetched automatically — `open_price` is not required.

        **Extra Margin Modes** (controlled by `extra_margin`):

        | | `extra_margin=false` (Manual) | `extra_margin=true` (Auto-split) |
        |---|---|---|
        | `quote_investment` meaning | Trading capital only | Total input (auto-split into trading capital + extra margin) |
        | `extra_margin_amount` | User-specified extra margin, on top of `quote_investment` | Typically omitted; system auto-calculates |
        | `estimate_investment` | = `quote_investment` | < `quote_investment` (trading capital portion) |
        | `estimate_extra_margin` | = `extra_margin_amount` | Auto-calculated (= `quote_investment` − `estimate_investment`) |
        | `min/max_investment` | Range for trading capital (excl. extra margin) | Range for total input (incl. extra margin) |

        **FailedWithData**: For errors marked "Yes" below, the response includes a `data` field
        even when `result=false`, containing `min_investment`, `max_investment`, and `slippage`
        so the client can display the valid investment range.

        **Validation error messages** (returned in `message` when `result` is `false`):

        | Message | Cause | Includes data |
        |---|---|---|
        | `base should end with .PERP` | `base` must end with `.PERP`, e.g. `BTC.PERP` | No |
        | `invalid trend` | `trend` must be `long`, `short`, or `no_trend` | No |
        | `invalid grid_type` | `grid_type` must be `arithmetic` or `geometric` | No |
        | `bottom must greater than 0` | `bottom` must be a positive number | No |
        | `top must greater than bottom` | `top` must be strictly greater than `bottom` | No |
        | `top must less or equal than max:{maxPrice}` | `top` exceeds the symbol's maximum allowed price | No |
        | `top not match quote precision` | `top` has more decimal places than the symbol allows | No |
        | `bottom not match quote precision` | `bottom` has more decimal places than the symbol allows | No |
        | `row must greater than 1` | `row` must be >= 2 | No |
        | `row must less than 501` | `row` must be <= 500 | No |
        | `invalid leverage` | `leverage` is outside the symbol's allowed leverage range | No |
        | `extra_margin should greater than or equal 0` | `extra_margin_amount` must be >= 0 | No |
        | `invalid condition_direction` | `condition_direction` must be `""`, `"1"`, or `"-1"` | No |
        | `quote_investment not match spending precision: max {N} decimal places` | `quote_investment` exceeds the allowed decimal precision | Yes |
        | `extra_margin_amount not match spending precision: max {N} decimal places` | `extra_margin_amount` exceeds the allowed decimal precision | Yes |
        | `grid profit per volume less than 0` | Grid range too narrow or `row` too large — profit per grid is negative | Yes |
        | `less than min investment` | `quote_investment` is `"0"` or less than `min_investment` | Yes |
      operationId: checkFuturesGridParams
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckFuturesGridParamsRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FuturesGridCheckParamsData'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/adjustParams:
    post:
      tags: [Futures Grid]
      summary: Adjust futures grid (add investment / modify range)
      description: "Add investment, modify grid range, or set trigger investment for a futures grid order. Weight: 1."
      operationId: adjustFuturesGridParams
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustFuturesGridRequest'
      responses:
        '200':
          description: Adjustment applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/reduce:
    post:
      tags: [Futures Grid]
      summary: Reduce futures grid position
      description: "Reduce position size of a futures grid order. Weight: 1."
      operationId: reduceFuturesGrid
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReduceFuturesGridRequest'
      responses:
        '200':
          description: Reduction result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReduceFuturesGridResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/cancel:
    post:
      tags: [Futures Grid]
      summary: Cancel futures grid order
      description: "Close and cancel a futures grid bot order. Weight: 1."
      operationId: cancelFuturesGridOrder
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelFuturesGridRequest'
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/adjustParamsCheck:
    post:
      tags: [Futures Grid]
      summary: Check futures grid adjust parameters (dry-run)
      description: |
        Validate adjust params / invest-in parameters and return estimated data without executing.
        Use this before calling adjustParams to preview the impact.
        Weight: 1.
      operationId: adjustFuturesGridParamsCheck
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustFuturesGridRequest'
      responses:
        '200':
          description: |
            Check result. On success: `result=true` with estimate data.
            On business validation failure: `result=false` with `BOT_INVALID_ARGUMENT` code, reason message, and partial estimate data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AdjustParamsCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/reduceCheck:
    post:
      tags: [Futures Grid]
      summary: Check futures grid reduce (dry-run)
      description: |
        Validate reduce parameters and return estimated data without executing.
        Use this before calling reduce to preview the impact.
        Weight: 1.
      operationId: reduceFuturesGridCheck
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReduceFuturesGridRequest'
      responses:
        '200':
          description: |
            Check result. On success: `result=true` with estimate data.
            On business validation failure: `result=false` with `BOT_INVALID_ARGUMENT` code, reason message, and partial estimate data.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ReduceCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/pauseCheck:
    post:
      tags: [Futures Grid]
      summary: Check futures grid pause (dry-run)
      description: |
        Validate whether a futures grid order can be paused (`immediate` or `conditional` mode)
        and return current plus post-trigger estimated liquidation prices without executing.
        Does not accept `openPrice`; the backend uses the live market price.
        `triggerPausePriceUp` / `triggerPausePriceDown` are independent — set either or both.
        Weight: 1.
      operationId: pauseFuturesGridCheck
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuturesGridPauseCheckRequest'
      responses:
        '200':
          description: |
            Check result. On success: `result=true` with estimate data.
            On business validation failure: `result=false` with `BOT_INVALID_ARGUMENT` code and reason message.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FuturesGridPauseCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/pause:
    post:
      tags: [Futures Grid]
      summary: Pause futures grid order
      description: |
        Pause a running futures grid order. Runs the same validation as `pauseCheck`, then
        executes asynchronously. Once paused the grid stops auto-refilling orders while the
        position is retained; `immediate` mode takes effect at the live market price.
        Does not return a `status` field (async processing).
        Weight: 1.
      operationId: pauseFuturesGrid
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuturesGridPauseRequest'
      responses:
        '200':
          description: Pause accepted (async).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FuturesGridPauseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/resumeCheck:
    post:
      tags: [Futures Grid]
      summary: Check futures grid resume (dry-run)
      description: |
        Validate whether a paused futures grid order can be resumed and return the estimated
        liquidation prices after resuming, without executing. Order must be in `paused` state.
        Weight: 1.
      operationId: resumeFuturesGridCheck
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuturesGridResumeRequest'
      responses:
        '200':
          description: |
            Check result. On success: `result=true` with estimate data.
            On business validation failure: `result=false` with `BOT_INVALID_ARGUMENT` code and reason message.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FuturesGridResumeCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/resume:
    post:
      tags: [Futures Grid]
      summary: Resume futures grid order
      description: |
        Resume a paused futures grid order. Runs the same validation as `resumeCheck`, then
        executes. After resuming the grid restarts auto-refilling and the liquidation price
        moves with the market.
        Weight: 1.
      operationId: resumeFuturesGrid
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuturesGridResumeRequest'
      responses:
        '200':
          description: Resume accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FuturesGridResumeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/addMarginCheck:
    post:
      tags: [Futures Grid]
      summary: Check futures grid add margin (dry-run)
      description: |
        Validate whether the add-margin amount is valid and return the estimated liquidation
        prices before and after the change, without executing.
        Does not accept `openPrice`; the backend uses the live market price.
        Weight: 1.
      operationId: addMarginFuturesGridCheck
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuturesGridMarginCheckRequest'
      responses:
        '200':
          description: |
            Check result. On success: `result=true` with estimate data.
            On business validation failure: `result=false` with `BOT_INVALID_ARGUMENT` code and reason message.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FuturesGridMarginCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/bot/orders/futuresGrid/addMargin:
    post:
      tags: [Futures Grid]
      summary: Add margin to futures grid order
      description: |
        Transfer margin into a futures grid order. Runs the same validation as `addMarginCheck`,
        then executes asynchronously. Directly affects available balance and the order's
        liquidation price — a funds operation, call with care.
        Does not return a `status` field (async processing).
        Weight: 1.
      operationId: addMarginFuturesGrid
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuturesGridMarginTransferRequest'
      responses:
        '200':
          description: Add margin accepted (async).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
