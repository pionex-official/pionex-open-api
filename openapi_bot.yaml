      properties:
        checkResult:
          type: boolean
          description: Whether the amount is valid
        reason:
          type: string
          description: "Failure reason when checkResult is false (fixed constant, e.g. FORBIDDEN_COPY_BOT_SUBORDER / FORBIDDEN_FULLY_HEDGING / EXCEEDS_MAX_AMOUNT)"
        estimateLiquidationPriceUpBefore:
          type: string
          description: Estimated upward liquidation price before the change
        estimateLiquidationPriceDownBefore:
          type: string
          description: Estimated downward liquidation price before the change
        estimateLiquidationPriceUpAfter:
          type: string
          description: Estimated upward liquidation price after the change
        estimateLiquidationPriceDownAfter:
          type: string
          description: Estimated downward liquidation price after the change
        maxAmount:
          type: string
          description: "Returned by reduceMarginCheck only — max reducible margin = min(existing extra margin, total equity − 1.05× used margin, margin account balance)"

    FuturesGridMarginTransferRequest:
      type: object
      required: [buOrderId, coin, amount]
      description: Shared by addMargin and reduceMargin; the direction (in/out) is fixed server-side by the route and not exposed as a request field.
      properties:
        buOrderId:
          type: string
          description: Bot order ID
        coin:
          type: string
          description: Transfer currency
        amount:
          type: number
          description: Margin amount to add / reduce (decimal)

    FuturesGridMarginTransferResponse:
      type: object
      description: Add/reduce margin execution result (no status field; processed asynchronously)
      properties:
        transferId:
          type: string
          description: Transfer record ID
        code:
          type: integer
          format: int32
          description: RPC return code
        message:
          type: string
          description: RPC return message

    FuturesGridTriggerProfitLossItem:
      type: object
      required: [type, stop_type, value]
      description: |
        A single take-profit or stop-loss setting. Field names are snake_case.
        How `value` / `limit_price` are interpreted depends on `stop_type`.
      properties:
        type:
          type: string
          description: "Which trigger this item configures"
          enum: [stop_loss, stop_profit]
        stop_type:
          type: string
          description: |
            How `value` is interpreted. Required (no implicit fallback):
            `price` (trigger price), `price_limit` (trigger price, closes via a limit
            order at `limit_price`), `profit_amount` (profit/loss amount),
            `profit_ratio` (profit/loss ratio).
          enum: [price, price_limit, profit_amount, profit_ratio]
        value:
          type: string
          description: |
            Trigger threshold, interpreted per `stop_type`. Empty string `""` clears the
            trigger. When non-empty it only needs to be a valid decimal — not enforced to
            be positive; `0` and negative values are accepted (e.g. `-0.2` = a −20%
            stop-loss ratio).
        limit_price:
          type: string
          description: Limit price used to close the position when `stop_type=price_limit`. Required in that case.
        stop_delay:
          type: integer
          format: int64
          description: Seconds to wait after the condition is first met before executing. `0` = immediate.
        loss_stop_sell_model:
          type: string
          description: "Settlement currency for a stop-loss close. Optional; empty = order default."
          enum: [TO_QUOTE, TO_USDT]
        profit_stop_sell_model:
          type: string
          description: "Settlement currency for a take-profit close. Optional; empty = order default."
          enum: [TO_QUOTE, TO_USDT]
        stop_high_price:
          type: string
          description: |
            Upper stop-loss price for a neutral grid (`no_trend`). Applies only to a
            `stop_loss` item and only when `stop_type` is `price` or `price_limit`;
            ignored otherwise.
        limit_high_price:
          type: string
          description: Upper limit stop-loss price for a neutral grid, used together with `stop_high_price` when `stop_type=price_limit`.

    FuturesGridUpdateTriggerProfitLossRequest:
      type: object
      required: [bu_order_id, list]
      description: |
        Set / update / clear the take-profit and stop-loss of a running futures grid order.
        Field names are snake_case (unlike the other futuresGrid endpoints).
      properties:
        bu_order_id:
          type: string
          description: Bot order ID
        list:
          type: array
          description: One item per trigger to configure. May include a `stop_loss` item, a `stop_profit` item, or both.
          items:
            $ref: '#/components/schemas/FuturesGridTriggerProfitLossItem'

    FuturesGridTriggerProfitLossResponse:
      type: object
      description: Echo of the applied trigger settings. Persistence onto the order is asynchronous — poll `GET /futuresGrid/order` to confirm.
      properties:
        bu_order_id:
          type: string
          description: Bot order ID
        result:
          type: integer
          format: int32
          description: RPC return code
        list:
          type: array
          description: Echo of the trigger settings that were applied.
          items:
            $ref: '#/components/schemas/FuturesGridTriggerProfitLossItem'

