    FuturesGridCheckParamsData:
      type: object
      description: |
        Futures grid parameter check result data.

        **When result=true**: All fields are populated with full estimate data.
        Liquidation price fields are cleared when `quote_investment` is outside [`min_investment`, `max_investment`].

        **When result=false with data (FailedWithData)**: Only `min_investment`, `max_investment`, and `slippage`
        are valid; all other estimate fields are empty. This occurs when `message` is one of:
        `"quote_investment not match spending precision: max {N} decimal places"`,
        `"extra_margin_amount not match spending precision: max {N} decimal places"`,
        `"grid profit per volume less than 0"`, or `"less than min investment"`.
      properties:
        min_investment:
          type: string
          description: |
            Minimum allowed `quote_investment`.
            - When `extra_margin=false`: minimum trading capital (excluding extra margin).
            - When `extra_margin=true`: minimum total input (including auto-calculated extra margin).
          example: "10.5"
        max_investment:
          type: string
          description: |
            Maximum allowed `quote_investment`.
            - When `extra_margin=false`: maximum trading capital (excluding extra margin).
            - When `extra_margin=true`: maximum total input (including auto-calculated extra margin).
          example: "50000"
        slippage:
          type: string
          description: "Recommended opening slippage (e.g. `\"0.01\"` = 1%)"
        estimate_per_volume:
          type: string
          description: "Estimated per-grid buy/sell quantity."
        estimate_investment:
          type: string
          description: |
            Estimated amount allocated to trading capital (= position margin + order margin + fee). Does **not** include extra margin.
            - When `extra_margin=false`: equals `quote_investment` (all input goes to trading capital).
            - When `extra_margin=true`: less than `quote_investment` — the remainder goes to `estimate_extra_margin`.
        estimate_extra_margin:
          type: string
          description: |
            Estimated extra margin — a safety buffer that reduces liquidation risk but is not used for grid trading itself.
            - When `extra_margin=false`: equals the input `extra_margin_amount` (pass-through).
            - When `extra_margin=true`: auto-calculated as `quote_investment - estimate_investment`.
        estimate_fee:
          type: string
          description: "Estimated opening trading fee (included in `estimate_investment`)."
        estimate_position_occupy_margin:
          type: string
          description: "Estimated margin occupied by positions opened immediately at creation (included in `estimate_investment`)."
        estimate_order_occupy_margin:
          type: string
          description: "Estimated margin occupied by pending grid orders (included in `estimate_investment`)."
        estimate_position:
          type: string
          description: "Estimated position opened immediately at order creation. Positive = long, negative = short."
        estimate_liquidation_price_up:
          type: string
          description: "Estimated upper liquidation price. Returns `\"0\"` for long-only grids (no upper liquidation risk). Empty when `quote_investment` is out of [`min_investment`, `max_investment`]."
        estimate_liquidation_price_down:
          type: string
          description: "Estimated lower liquidation price. Returns `\"0\"` for short-only grids (no lower liquidation risk). Empty when `quote_investment` is out of [`min_investment`, `max_investment`]."

    SpotGridCheckParamsData:
      type: object
      description: |
        Spot grid parameter check result data.

        **When result=true**: All fields are populated.

        **When result=false with data (FailedWithData)**: Only `min_investment`, `max_investment`, and `slippage`
        are valid; all other estimate fields are empty. This occurs when `message` is one of:
        `"grid price duplicated: reduce row or widen range"`,
        `"quote_total_investment not match quote precision: max {N} decimal places"`, or `"less than min investment"`.
      properties:
        min_investment:
          type: string
          description: Minimum investment amount in quote currency
          example: "10"
        max_investment:
          type: string
          description: Maximum investment amount in quote currency
          example: "100000"
        slippage:
          type: string
          description: "Recommended opening slippage (e.g. `\"0.01\"` = 1%)"
        estimate_per_volume:
          type: string
          description: "Estimated per-grid buy/sell quantity."
        estimate_fee:
          type: string
          description: "Estimated opening trading fee."

    CheckParamsResponse:
      $ref: '#/components/schemas/SpotGridCheckParamsData'

