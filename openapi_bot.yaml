          description: Estimated upward liquidation price
        estimateLiquidationPriceDown:
          type: string
          description: Estimated downward liquidation price
        estimateLiquidationPriceUpAfter:
          type: string
          description: Estimated upward liquidation price after adjustment
        estimateLiquidationPriceDownAfter:
          type: string
          description: Estimated downward liquidation price after adjustment
        estimateDeltaPosition:
          type: string
          description: Estimated position change
        estimateDeltaProfit:
          type: string
          description: Estimated profit/loss from position change
        estimatePerVolume:
          type: string
          description: Estimated per-grid volume after adjustment
        slippage:
          type: string
          description: Recommended slippage

    ReduceCheckResponse:
      type: object
      description: Reduce check result with estimate data
      properties:
        checkResult:
          type: boolean
          description: Whether the reduction is feasible
        reason:
          type: string
          description: Failure reason when checkResult is false
        maxReduceNum:
