    # =========================================================================
    # KOL schemas
    # =========================================================================

    KolSelectCopyTradeListData:
      type: object
      description: KOL curated copy-trade order list response
      properties:
        total:
          type: integer
          format: int64
          description: Total number of matching orders
        page:
          type: integer
          format: int64
          description: Current page number
        hasMore:
          type: boolean
          description: Whether more pages are available
        filterOptions:
          $ref: '#/components/schemas/KolFilterOptions'
        kolInfo:
          $ref: '#/components/schemas/KolInfo'
        results:
          type: array
          description: Curated copy-trade orders
          items:
            $ref: '#/components/schemas/KolCopyTradeOrder'
        topResults:
          type: array
          description: Pinned/top copy-trade orders
          items:
            $ref: '#/components/schemas/KolCopyTradeOrder'

    KolFilterOptions:
      type: object
      description: Available filter options for the KOL's orders
      properties:
        symbolList:
          type: array
          description: Available symbol filters
          items:
            type: string
        leverageList:
          type: array
          description: Available leverage filters
          items:
            type: integer
            format: int64
        trendList:
          type: array
          description: Available trend filters
          items:
            type: string

    KolInfo:
      type: object
      description: KOL profile information
      properties:
        nickname:
          type: string
          description: KOL nickname
        shareCode:
          type: string
          description: KOL share code
        headerImg:
          type: string
          description: KOL header image URL
        isShowInvestment:
          type: boolean
          description: Whether investment amounts are shown
        avatar:
          type: string
          description: KOL avatar URL
        userId:
          type: string
          description: KOL user ID
        isShowGroupEntry:
          type: integer
          format: int64
          description: Whether the group entry is shown
        groupInfoList:
          type: array
          description: KOL community group list
          items:
            $ref: '#/components/schemas/KolGroupInfo'

    KolGroupInfo:
      type: object
      description: KOL community group info
      properties:
        id:
          type: integer
          format: int64
          description: Group ID
        userId:
          type: string
          description: KOL user ID
        community:
          type: string
          description: Community name
        rank:
          type: integer
          format: int64
          description: Group rank
        link:
          type: string
          description: Community link
        createTime:
          type: string
          description: Creation time (RFC3339)
          example: "0001-01-01T00:00:00Z"
        updateTime:
          type: string
          description: Update time (RFC3339)
          example: "0001-01-01T00:00:00Z"
        picUrl:
          type: string
          description: Community picture URL

    KolCopyTradeOrder:
      type: object
      description: A KOL curated copy-trade order entry
      properties:
        buOrderId:
          type: string
          description: Bot order ID
        buOrderType:
          type: string
          description: Bot order type
        rank:
          type: integer
          format: int64
          description: Order rank
        base:
          type: string
          description: Base currency
        quote:
          type: string
          description: Quote currency
        uniqueId:
          type: string
          description: Unique identifier
        status:
          type: string
          description: Order status
        createTime:
          type: integer
          format: int64
          description: Creation timestamp in milliseconds
        closeTime:
          type: integer
          format: int64
          description: Close timestamp in milliseconds
        isTop:
          type: boolean
          description: Whether the order is pinned/top
        buOrderData:
          $ref: '#/components/schemas/KolCopyTradeOrderData'

    KolCopyTradeOrderData:
      type: object
      description: KOL copy-trade order detail data
      properties:
        quoteInvestment:
          type: string
          description: Investment amount in quote currency
        extraMargin:
          type: string
          description: Extra margin amount
        top:
          type: string
          description: Grid upper price
        bottom:
          type: string
          description: Grid lower price
        row:
          type: integer
          format: int64
          description: Number of grid levels
        gridApr:
          type: string
          description: Grid APR
        trend:
          type: string
          description: Grid direction (e.g. long, short, no_trend)
        leverage:
          type: string
          description: Leverage multiplier
        initPrice:
          type: string
          description: Price at order creation
        curPrice:
          type: string
          description: Current price
        rota:
          type: string
          description: Return on total assets
        uiExtraData:
          type: string
          description: Frontend extra data
        triggerTime:
          type: integer
          format: int64
          description: Trigger timestamp in milliseconds
        condition:
          type: string
          description: Trigger price (for conditional orders)
        conditionDirection:
          type: string
          description: "Trigger direction: \"-1\" (price drops to) or \"1\" (price rises to)"

    # =========================================================================
    # Signal schemas
    # =========================================================================

    SignalListenerRequest:
      type: object
      required: [signalType, signalParam, base, quote, time, price, data]
      properties:
        signalType:
          type: string
          description: Signal type identifier (ASCII, max 1000 chars)
          example: my_signal
        signalParam:
          type: string
          description: Signal parameters (ASCII, max 5000 chars)
          example: "{}"
        base:
          type: string
          description: Base currency (e.g. BTC)
          example: BTC
        quote:
          type: string
          description: Quote currency (e.g. USDT)
          example: USDT
        time:
          type: string
          format: date-time
          description: Signal trigger time (RFC3339)
          example: "2024-01-15T10:30:00Z"
        price:
          type: string
          description: Price at signal trigger time (ASCII, max 30 chars)
          example: "45000.5"
        data:
          $ref: '#/components/schemas/SignalListenerData'

    SignalListenerData:
      type: object
      required: [action, position_size, contracts]
      properties:
        action:
          type: string
          description: Trading action
          enum: [buy, sell]
          example: buy
        position_size:
          type: string
          description: Position size as a ratio or absolute value
          example: "1"
        contracts:
          type: string
          description: Number of contracts
          example: "1"
        direction:
          type: string
          description: Optional trading direction hint
          example: long

    # =========================================================================
    # User-defined Signal schemas
    # =========================================================================

    CreateUserSignalRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: Signal name (max 100 chars)
          maxLength: 100
          example: My TradingView Signal
        description:
          type: string
          description: Signal description (max 1000 chars)
          maxLength: 1000
          example: RSI crossover strategy signal

    EditUserSignalRequest:
      type: object
      description: At least one field must be provided.
      properties:
        title:
          type: string
          description: New signal name (max 100 chars)
          maxLength: 100
          example: Updated Signal Name
        description:
          type: string
          description: New signal description (max 10000 chars)
          maxLength: 10000
          example: Updated description

    TradingViewConfig:
      type: object
      properties:
        webhookUrl:
          type: string
          description: Webhook URL to configure in TradingView
          example: "https://www.pionex.com/signal/api/v1/signal_listener/trading_view?token=abc123"
        message:
          type: string
          description: JSON message template to use in TradingView alert
          example: '{"signalType":"my_signal","signalParam":"{}","symbol":"{{ticker}}","time":"{{timenow}}","price":"{{close}}","data":{"action":"{{strategy.order.action}}","contracts":"{{strategy.order.contracts}}","positionSize":"{{strategy.position_size}}"}}'

    UserSignalDetail:
      type: object
      properties:
        signalType:
          type: string
          description: Signal type identifier (auto-generated)
          example: "79899b4d-7f95-4288-97ef-f021e770aa67"
        title:
          type: string
          description: Signal name
          example: My TradingView Signal
        description:
          type: string
          description: Signal description
          example: RSI crossover strategy signal
        confirmConfig:
          type: integer
          description: "Whether the webhook is configured: 0 = not confirmed, 1 = confirmed"
          enum: [0, 1]
          example: 0
        tradingviewConfig:
          $ref: '#/components/schemas/TradingViewConfig'

    UserSignalListResponse:
      type: object
      properties:
        pageToken:
          type: string
          description: Pagination token for the next page. Empty string when there are no more results.
          example: "eyJuZXh0IjoxMH0="
        signals:
          type: array
          description: List of user-defined signals
          items:
            $ref: '#/components/schemas/UserSignalDetail'
