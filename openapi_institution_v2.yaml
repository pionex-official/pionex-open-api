        Delete a payout (payee) account. Requires the `userId`'s platform KYB to
        be `APPROVED`.
      operationId: institutionPayoutAccountDelete
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, accountId, channel]
              properties:
                userId:
                  type: string
                accountId:
                  type: string
                channel:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Empty object.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # -------------------------------------------------------------------------
  # Payout
  # -------------------------------------------------------------------------

  /api/v2/institution/wire/payout/order/create:
    post:
      tags: [Payout]
      summary: Create a payout (fiat withdrawal)
      description: |
        Create a payout (fiat withdrawal). Requires the `userId`'s platform KYB to
        be `APPROVED`.

        **Idempotency:** always send a unique `clientOrderId`; on timeout/no-response,
        re-send with the **same** `clientOrderId` (or query first via List/Get
        Payout Order) - never retry with a new key.
      operationId: institutionPayoutOrderCreate
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, clientOrderId]
              properties:
                userId:
                  type: string
                  description: Sub-account UUID.
                clientOrderId:
                  type: string
                  description: Globally unique idempotency key. Retries must reuse the original value.
                channel:
                  type: string
                payoutAccountId:
                  type: string
                  description: Target payout account (`accountId` from Create/List Payout Account).
                sourceCurrency:
                  type: string
                  description: Debit asset code (e.g. `USDT`).
                targetCurrency:
                  type: string
                  description: Credited asset code (e.g. `USD`).
                amount:
                  type: string
                  description: Total debit amount, in `sourceCurrency`.
                channelExtra:
                  type: array
                  items:
                    $ref: '#/components/schemas/KeyValue'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId:
                            type: string
                          status:
                            type: string
                          amount:
                            type: string
                          feeAmount:
                            type: string
                          finalAmount:
                            type: string
                          reason:
                            $ref: '#/components/schemas/Reason'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/wire/payout/orders:
    get:
      tags: [Payout]
      summary: List payout orders
      description: |
        List payout orders for a `userId`. Requires the `userId`'s platform KYB to
        be `APPROVED`.
      operationId: institutionPayoutOrdersList
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
        - name: channel
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/PayoutOrder'
                          total:
                            type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/wire/payout/order:
    get:
      tags: [Payout]
      summary: Get a payout order
      description: |
        Get a single payout order by `orderId` **or** `clientOrderId`. Requires the
        `userId`'s platform KYB to be `APPROVED`.
      operationId: institutionPayoutOrderGet
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
        - name: orderId
          in: query
          required: false
          description: Provide `orderId` or `clientOrderId`.
          schema:
            type: string
        - name: clientOrderId
          in: query
          required: false
          description: Provide `orderId` or `clientOrderId`.
          schema:
            type: string
        - name: channel
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PayoutOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # -------------------------------------------------------------------------
  # Asset (On-Chain)
  # -------------------------------------------------------------------------

  /api/v2/institution/asset/currencies:
    get:
      tags: [Asset]
      summary: List currencies and chains
      description: |
        List supported currencies and their chains. This is a public/self endpoint
        and does not take `userId`, but still requires a valid signature and the
        `read` scope.
      operationId: institutionAssetCurrencies
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - name: currency
          in: query
          required: false
          description: Filter by currency, max 60.
          schema:
            type: string
            maxLength: 60
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          currencies:
                            type: array
                            items:
                              $ref: '#/components/schemas/Currency'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/asset/withdraw:
    post:
      tags: [Asset]
      summary: Create an on-chain withdrawal
      description: |
        Create an on-chain withdrawal. The address whitelist must be enabled and
        the address must be whitelisted (or in the address book, for sub-accounts).

        **Errors:**

        | Error Code | Description |
        |------------|-------------|
        | `P_PAY_OPEN_API_ACCOUNT_FROZEN` | Deposits/withdrawals frozen for this account. |
        | `P_PAY_OPEN_API_KYC_REQUIRED` | KYC not completed or insufficient level. |
        | `P_PAY_OPEN_API_REGION_RESTRICTED` | The operation is restricted in your region. |
        | `P_PAY_OPEN_API_SIGN_REJECTED` | Security signature check failed. |
        | `P_PAY_OPEN_API_OPERATION_FORBIDDEN` | Blocked after high-risk behavior; `data` contains `restrict_expired_on`, `restrict_ttl`. |
        | `P_PAY_OPEN_API_UNSUPPORTED_CURRENCY` | `currency` + `chain` combination unsupported. |
        | `P_PAY_OPEN_API_WITHDRAW_WHITELIST_CLOSED` | Address whitelist not enabled (mandatory for Open API). |
        | `P_PAY_OPEN_API_WITHDRAW_ADDRESS_NOT_WHITELISTED` | Address not on the whitelist. |
        | `P_PAY_OPEN_API_WITHDRAW_ADDRESS_NOT_ALLOWED` | Address not on the configured allow list. |
        | `P_PAY_OPEN_API_WITHDRAW_ADDRESS_NOT_IN_ADDRESS_BOOK` | Sub-account address not in the address book. |
      operationId: institutionAssetWithdrawCreate
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, clientId, currency, chain, address, amount]
              properties:
                userId:
                  type: string
                  description: Sub-account UUID.
                clientId:
                  type: string
                  description: Idempotency key, globally unique, max 64. Retries must reuse the original value.
                  maxLength: 64
                currency:
                  type: string
                  description: e.g. `USDT`, max 60.
                  maxLength: 60
                chain:
                  type: string
                  description: A withdraw-enabled chain from List Currencies, max 60.
                  maxLength: 60
                address:
                  type: string
                  description: Destination address, max 300.
                  maxLength: 300
                tag:
                  type: string
                  description: Tag/Memo, required for currencies where `hasTag=true`, max 100.
                  maxLength: 100
                amount:
                  type: string
                  description: Amount, max 60.
                  maxLength: 60
                note:
                  type: string
                  description: Note, max 100.
                  maxLength: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            example: "123456789"
                          clientId:
                            type: string
                            example: my-withdraw-001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Asset]
      summary: Query a single on-chain withdrawal
      description: |
        Query a single on-chain withdrawal by `id` or `clientId` (at least one
        required).
      operationId: institutionAssetWithdrawGet
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
        - name: id
          in: query
          required: false
          description: Withdrawal id, max 64. Provide `id` or `clientId`.
          schema:
            type: string
            maxLength: 64
        - name: clientId
          in: query
          required: false
          description: Client idempotency key, max 64. Provide `id` or `clientId`.
          schema:
            type: string
            maxLength: 64
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AssetRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/asset/records:
    get:
      tags: [Asset]
      summary: Query deposit/withdrawal history
      description: |
        Query on-chain deposit/withdrawal history for a `userId`.
      operationId: institutionAssetRecords
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
        - name: type
          in: query
          required: false
          description: "`DEPOSIT` / `WITHDRAW`."
          schema:
            type: string
            enum: [DEPOSIT, WITHDRAW]
        - name: currency
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          records:
                            type: array
                            items:
                              $ref: '#/components/schemas/AssetRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # -------------------------------------------------------------------------
  # Address Book
  # -------------------------------------------------------------------------

  /api/v2/institution/addressBooks:
    get:
      tags: [Address Book]
      summary: List address-book entries
      description: |
        List address-book entries for a `userId`. `currency` and `chain` are used
        together.
      operationId: institutionAddressBooksList
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
        - name: currency
          in: query
          required: false
          description: Use together with `chain`.
          schema:
            type: string
        - name: chain
          in: query
          required: false
          description: Use together with `currency`.
          schema:
            type: string
        - name: onlyWhitelist
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/AddressBookEntry'
                          total:
                            type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/addressBook:
    post:
      tags: [Address Book]
      summary: Add an address-book entry
      description: |
        Add an address-book entry for a `userId`.
      operationId: institutionAddressBookAdd
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, currency, chain, address, label]
              properties:
                userId:
                  type: string
                currency:
                  type: string
                chain:
                  type: string
                address:
                  type: string
                label:
                  type: string
                memo:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AddressBookEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/addressBook/delete:
    post:
      tags: [Address Book]
      summary: Delete an address-book entry
      description: |
        Delete an address-book entry for a `userId`.
      operationId: institutionAddressBookDelete
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, addressId]
              properties:
                userId:
                  type: string
                addressId:
                  type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        description: Empty object.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # -------------------------------------------------------------------------
  # Account
  # -------------------------------------------------------------------------

  /api/v2/institution/account/balances:
    get:
      tags: [Account]
      summary: Get trading-account balances
      description: |
        Get trading-account balances for a `userId`. `list[]` items are
        `{ coin, free, frozen }` (8-decimal decimal strings), sorted by coin
        ascending.
      operationId: institutionAccountBalances
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/Balance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # -------------------------------------------------------------------------
  # Convert
  # -------------------------------------------------------------------------

  /api/v2/institution/convert/order/create:
    post:
      tags: [Convert]
      summary: Create a conversion
      description: |
        Create a conversion order. `baseAmount` is required only when `side=SELL`;
        `quoteAmount` is required only when `side=BUY`.

        **Errors:**

        | Error Code | Description |
        |------------|-------------|
        | `P_PAY_OPEN_API_CONVERT_INVALID_AMOUNT` | `side=SELL` without `baseAmount`, or `side=BUY` without `quoteAmount`. |
        | `P_PAY_OPEN_API_SYMBOL_MAINTENANCE` | Trading pair under maintenance. |
        | `P_PAY_OPEN_API_SYMBOL_MARKET_CLOSE` | Trading pair closed (non-trading day). |
      operationId: institutionConvertOrderCreate
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, baseCoin, quoteCoin, side]
              properties:
                userId:
                  type: string
                baseCoin:
                  type: string
                  description: Base currency.
                quoteCoin:
                  type: string
                  description: Quote currency.
                side:
                  type: string
                  enum: [BUY, SELL]
                baseAmount:
                  type: string
                  description: Base amount - required only when `side=SELL`.
                quoteAmount:
                  type: string
                  description: Quote amount - required only when `side=BUY`.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId:
                            type: string
                            example: ord-1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/convert/orders:
    get:
      tags: [Convert]
      summary: List conversion orders
      description: |
        List conversion orders for a `userId`.
      operationId: institutionConvertOrdersList
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
        - $ref: '#/components/parameters/StartTime'
        - $ref: '#/components/parameters/EndTime'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/ConvertRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/convert/order:
    get:
      tags: [Convert]
      summary: Get a conversion order
      description: |
        Get a single conversion order.
      operationId: institutionConvertOrderGet
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
        - name: orderId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ConvertRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # -------------------------------------------------------------------------
  # File
  # -------------------------------------------------------------------------

  /api/v2/institution/file/upload:
    post:
      tags: [File]
      summary: Upload a file (KYB / supporting documents)
      description: |
        Upload a file (KYB / supporting documents), referenced elsewhere by
        `fileId`. `userId` is passed in the **query string** (the request body is
        multipart, so `userId` cannot go in the body here).
      operationId: institutionFileUpload
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          fileId:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/file/download:
    get:
      tags: [File]
      summary: Download a file
      description: |
        Download a previously uploaded file by `fileId`. Returns a binary stream.
      operationId: institutionFileDownload
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
        - name: fileId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Binary file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-APIKEY
      description: |
        Your institution API Key, in the form `webot_xxxxxxxx`. Used to look up
        your registered public key. Must be accompanied by the `X-Signature`
        header. See the Authentication section for the full signing algorithm
        (RSA-PSS over SHA-256, or Ed25519) and the canonical-string construction.
    Signature:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        Base64 (standard encoding) of the signature over the canonical string
        `{sub_path}:{sorted_query_string}:{request_body}:{timestamp}`. The
        algorithm (RSA-PSS/SHA-256 or Ed25519) is fixed by the type of the public
        key you registered. See the Authentication section for details.

  parameters:
    Timestamp:
      name: timestamp
      in: query
      required: true
      description: |
        Current time in **seconds** (Unix). Required on every signed request and
        participates in the signature. Must be within +/-5 seconds of server time.
      schema:
        type: integer
        format: int64
      example: 1785706000
    UserIdQueryRequired:
      name: userId
      in: query
      required: true
      description: Target sub-account UUID. Participates in the signature.
      schema:
        type: string
      example: "88001234-1a2b-..."
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting from 1.
      schema:
        type: integer
    Size:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
    StartTime:
      name: startTime
      in: query
      required: false
      description: Start time, millisecond Unix timestamp.
      schema:
        type: integer
        format: int64
    EndTime:
      name: endTime
      in: query
      required: false
      description: End time, millisecond Unix timestamp.
      schema:
        type: integer
        format: int64

  schemas:
    BaseResponse:
      type: object
      properties:
        result:
          type: boolean
          description: Success indicator.
        timestamp:
          type: integer
          format: int64
          description: Response timestamp in milliseconds.
        code:
          type: string
          description: Error code (present only on failure).
        message:
          type: string
          description: Error message (present only on failure).

    Reason:
      type: object
      description: Failure/return reason, present only when a channel returns one.
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
          description: Whether the same request/order may be retried.

    KeyValue:
      type: object
      description: A generic key/value pair.
      properties:
        key:
          type: string
        value:
          type: string

    SubAccount:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        entityType:
          type: string
          enum: [CORPORATE, INDIVIDUAL]
        status:
          type: string
          example: ACTIVE
        remark:
          type: string
        createTime:
          type: integer
          format: int64
          description: Millisecond Unix timestamp.

    KybCreateRequest:
      type: object
      required: [userId]
      description: |
        Platform KYB submission. `subject`, `representatives`, and `documents`
        carry canonical keys as documented in the Platform KYB Field Reference.
      properties:
        userId:
          type: string
          description: Sub-account UUID. A `userId` has a single platform KYB application.
        subject:
          $ref: '#/components/schemas/KybFieldGroup'
        representatives:
          type: array
          items:
            $ref: '#/components/schemas/KybRepresentative'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/KybDocument'

    KybFieldGroup:
      type: object
      description: "A group of canonical key/value fields: `{ fields: [ { key, value } ] }`."
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'

    KybRepresentative:
      type: object
      description: One natural person, identified by `representativeRef`.
      properties:
        representativeRef:
          type: string
          description: Stable per-person id; keep unchanged across supplements.
        fields:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'

    KybDocument:
      type: object
      description: A KYB document reference. Upload the file first, then reference by `fileId`.
      properties:
        purpose:
          type: string
          description: The document's canonical key (e.g. `subject.sourceOfFundsProof`).
        fileId:
          type: string
        scope:
          type: string
          enum: [SUBJECT, REPRESENTATIVE]
        representativeRef:
          type: string
          description: Required when `scope = REPRESENTATIVE`.

    KybStatus:
      type: object
      properties:
        status:
          type: string
          description: "`SUBMITTED` / `PENDING` / `SUPPLEMENT_REQUIRED` / `APPROVED` / `REJECTED`."
          enum: [SUBMITTED, PENDING, SUPPLEMENT_REQUIRED, APPROVED, REJECTED]
        reason:
          type: string
          description: Review conclusion code; empty before review.
        message:
          type: string
          description: Conclusion description; empty before review.

    Requirement:
      type: object
      description: A dynamic channel-KYB requirement item.
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [FIELD, DOCUMENT]
        mode:
          type: string
          enum: [REQUIRED, OPTIONAL, CONDITIONAL]
          description: Source of truth for whether to submit the item.
        label:
          type: string
        regex:
          type: string
        example:
          type: string
        enumValues:
          type: array
          items:
            type: string

    ChannelRequirements:
      type: object
      description: Items still required for channel deposit onboarding.
      properties:
        subjectFields:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: Subject fields still missing.
        subjectDocuments:
          type: array
          items:
            $ref: '#/components/schemas/Requirement'
          description: Subject documents still missing (flattened, one per purpose).
        requiresRepresentatives:
          type: boolean
        representatives:
          type: array
          description: "What each contact still needs, one entry per contact."
          items:
            type: object
            properties:
              representativeRef:
                type: string
              fields:
                type: array
                items:
                  $ref: '#/components/schemas/Requirement'
              documents:
                type: array
                items:
                  $ref: '#/components/schemas/Requirement'
        fileLimit:
          type: object
          properties:
            maxFileCount:
              type: integer
            maxFileBytes:
              type: integer
              format: int64
            maxTotalBytes:
              type: integer
              format: int64
            contentTypes:
              type: array
              items:
                type: string
        tosMode:
          type: string
          enum: [NONE, HOSTED_LINK, INLINE_ACCEPT]
        tosUrl:
          type: string
          description: Terms URL; empty when `NONE`.
        termsVersion:
          type: string
          description: Terms version; non-empty only for `INLINE_ACCEPT`.
        requiresBusinessType:
          type: boolean
          description: Always `false` in this API - the business type comes from platform KYB.

    FieldRequirement:
      type: object
      description: A payout-account field requirement.
      properties:
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
        regex:
          type: string
        isExtra:
          type: boolean
          description: When `true`, put the value into `channelExtra`.
        kind:
          type: string
          enum: [FIELD, DOCUMENT]
          description: A `DOCUMENT` field is supplied via `spec.documents` (by `fileId`).

    DepositAccount:
      type: object
      properties:
        channel:
          type: string
        accountId:
          type: string
        currency:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE, UNAVAILABLE, CLOSED]
          description: "`PENDING` (not yet remittable) / `ACTIVE` (remittable) / `UNAVAILABLE` / `CLOSED`."
        channelStatus:
          type: string
        instructions:
          type: array
          items:
            $ref: '#/components/schemas/FundingInstruction'
        feeAmount:
          type: string
        minDepositAmount:
          type: string
        maxDepositAmount:
          type: string

    FundingInstruction:
      type: object
      description: Wire funding instruction fields.
      properties:
        rails:
          type: array
          items:
            type: string
        message:
          type: string
        bankName:
          type: string
        bankAddress:
          type: string
        accountNumber:
          type: string
        routingCode:
          type: string
        routingCodeAlternate:
          type: string
        swiftBic:
          type: string
        accountHolderName:
          type: string
        accountHolderAddress:
          type: string
        reference:
          type: string
        channelExtra:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'

    DepositOrder:
      type: object
      properties:
        orderId:
          type: string
        channel:
          type: string
        creditCurrency:
          type: string
        receivedCurrency:
          type: string
        receivedAmount:
          type: string
        feeAmount:
          type: string
        creditAmount:
          type: string
        status:
          type: string
          enum: [PENDING, CREDITED, COMPLETED, FAILED, CANCELED]
          description: "`PENDING` (processing) / `CREDITED` (credited, not settled) / `COMPLETED` (final) / `FAILED` (final) / `CANCELED` (final)."
        rail:
          type: string
        rate:
          type: string
        reason:
          $ref: '#/components/schemas/Reason'
        createdAt:
          type: integer
          format: int64
          description: Millisecond Unix timestamp; `0` until the event occurs.
        updatedAt:
          type: integer
          format: int64
        creditedAt:
          type: integer
          format: int64
          description: "`0` before crediting."
        completedAt:
          type: integer
          format: int64
          description: "`0` before the order is final."

    PayoutAccount:
      type: object
      properties:
        accountId:
          type: string
        channel:
          type: string
        status:
          type: string
          enum: [IN_REVIEW, AVAILABLE, NEEDS_UPDATE, UNAVAILABLE, DELETED]
        rejectReason:
          $ref: '#/components/schemas/Reason'
        accountLast4:
          type: string
        bankName:
          type: string
        currency:
          type: string
        country:
          type: string
        rail:
          type: string
        accountHolderName:
          type: string
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        editableFields:
          type: array
          items:
            type: string
          description: Fields that may be changed via Update Payout Account.

    PayoutAccountSpec:
      type: object
      description: Payout-account spec; fields constrained by the requirements endpoint.
      properties:
        currency:
          type: string
        country:
          type: string
        rail:
          type: string
        holderType:
          type: string
          enum: [INDIVIDUAL, BUSINESS]
        accountHolderName:
          type: string
        accountHolderAddress:
          type: string
        bankName:
          type: string
        routingNumber:
          type: string
        accountNumber:
          type: string
        accountType:
          type: string
          enum: [CHECKING, SAVINGS]
        fileIds:
          type: array
          items:
            type: string
        channelExtra:
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'
        documents:
          type: array
          items:
            type: object
            properties:
              purpose:
                type: string
                description: The requirement `key` whose `kind` is `DOCUMENT`.
              fileId:
                type: string

    PayoutOrder:
      type: object
      properties:
        orderId:
          type: string
        clientOrderId:
          type: string
        channel:
          type: string
        payoutAccountId:
          type: string
        sourceCurrency:
          type: string
        targetCurrency:
          type: string
        amount:
          type: string
        feeAmount:
          type: string
        finalAmount:
          type: string
        rate:
          type: string
        status:
          type: string
          enum: [PENDING, IN_REVIEW, PROCESSING, COMPLETED, FAILED, RETURNED, REFUNDING, REFUNDED]
          description: "`COMPLETED` / `FAILED` are final."
        reason:
          $ref: '#/components/schemas/Reason'
        rail:
          type: string
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        completedAt:
          type: integer
          format: int64
          description: "`0` before the order is final."
        refundedAt:
          type: integer
          format: int64
          description: "`0` before any refund."

    Currency:
      type: object
      properties:
        currency:
          type: string
        displayName:
          type: string
        fullName:
          type: string
        chainList:
          type: array
          items:
            $ref: '#/components/schemas/Chain'

    Chain:
      type: object
      properties:
        chain:
          type: string
        txType:
          type: string
        depositEnable:
          type: boolean
        withdrawEnable:
          type: boolean
        depositMin:
          type: string
        withdrawMin:
          type: string
        withdrawMax:
          type: string
        withdrawFee:
          type: string
        hasTag:
          type: boolean
        confirm:
          type: integer
        withdrawPrecision:
          type: integer
        contractAddress:
          type: string
        walletType:
          type: string
        preConfirm:
          type: integer

    AssetRecord:
      type: object
      properties:
        id:
          type: string
        clientId:
          type: string
        currency:
          type: string
        chain:
          type: string
        type:
          type: string
          enum: [deposit, withdraw]
        internal:
          type: boolean
        address:
          type: string
        tag:
          type: string
        addressFrom:
          type: string
        tagFrom:
          type: string
        amount:
          type: string
        fee:
          type: string
        status:
          type: string
        hash:
          type: string
        confirmations:
          type: integer
        note:
          type: string
        approvalReason:
          type: string
        createTime:
          type: integer
          format: int64
        updateTime:
          type: integer
          format: int64

    AddressBookEntry:
      type: object
      properties:
        addressId:
          type: string
        currency:
          type: string
        chain:
          type: string
        address:
          type: string
        memo:
          type: string
        label:
          type: string
        whitelist:
          type: boolean
        createTime:
          type: integer
          format: int64

    Balance:
      type: object
      properties:
        coin:
          type: string
        free:
          type: string
          description: 8-decimal decimal string.
        frozen:
          type: string
          description: 8-decimal decimal string.

    ConvertRecord:
      type: object
      properties:
        orderId:
          type: string
        baseCoin:
          type: string
        quoteCoin:
          type: string
        baseAmount:
          type: string
        quoteAmount:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        price:
          type: string
        status:
          type: string
        failReason:
          type: string
        createTime:
          type: integer
          format: int64
        updateTime:
          type: integer
          format: int64

  responses:
    BadRequest:
      description: Bad Request - the request body could not be read.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/BaseResponse'
          example:
            result: false
            code: P_PAY_OPEN_API_INVALID_ARGUMENT
            message: invalid argument
            timestamp: 1785706000000

    Unauthorized:
      description: Unauthorized - authentication failed (missing key, bad signature, etc.).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/BaseResponse'
          example:
            result: false
            code: P_PAY_OPEN_API_UNAUTHENTICATED
            message: authentication failed
            timestamp: 1785706000000

    InternalError:
      description: |
        Internal or business error. Note that most business failures are returned
        as HTTP `200` with `result: false` and a `code`; this `500` covers
        server-side internal errors.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/BaseResponse'
          example:
            result: false
            code: P_PAY_OPEN_API_INTERNAL_ERROR
            message: internal error
            timestamp: 1785706000000
