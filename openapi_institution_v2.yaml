        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/wire/deposit/account/requirements:
    get:
      tags: [KYB]
      summary: Get channel onboarding requirements
      description: |
        Returns the items still required for channel deposit onboarding.
        Information already provided is omitted. Representative requirements are
        returned per contact.

        Channel KYB fields are **dynamic** - call this endpoint first, then fill
        per the returned `Requirement` items. Do not hard-code channel field lists.

        - **`mode`** is the source of truth for whether to submit an item:
          `REQUIRED` (must submit), `OPTIONAL`, or `CONDITIONAL`. `CONDITIONAL`
          means the item becomes required only when other fields take certain
          values; when unsure, submit it.
        - **`kind`** is `FIELD` or `DOCUMENT`. Documents are referenced by
          `fileId` (upload first); do not inline file bytes.
        - Representatives are grouped by `representativeRef`.
        - `regex` / `example` / `enumValues` on a field are for client-side
          validation and hints.
        - Documents must be submitted in full.

        Do not pass `country` or `businessType` - the requirement set follows the
        values from your platform KYB (`subject.country` / `subject.businessType`).

        > **`channel` currently supports only `bridge`.**
      operationId: institutionDepositAccountRequirements
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/UserIdQueryRequired'
        - name: channel
          in: query
          required: true
          description: Channel identifier. Currently only `bridge` is supported.
          schema:
            type: string
            example: bridge
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ChannelRequirements'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/wire/deposit/account/create:
    post:
      tags: [KYB]
      summary: Onboard a deposit account (channel KYB)
      description: |
        Submit channel onboarding. Returns onboarding `status` only; missing/invalid
        items are not itemized - call the requirements endpoint to learn what is
        still missing.

        Provide **all** required documents in full every time. Do not pass
        `country` or `businessType` here - they come from your platform KYB. Any
        `fileId` you reference must belong to this `userId`.

        Requires the `userId`'s platform KYB to be `APPROVED`.

        **Errors:**

        | Error Code | Description |
        |------------|-------------|
        | `P_PAY_OPEN_API_INTERNAL_KYB_NOT_APPROVED` | Platform KYB is not approved yet; it must be approved before channel onboarding. |
        | `P_PAY_OPEN_API_KYB_ADDRESS_REJECTED` | Address rejected by the channel; `data.violations` names the rejected fields. |
        | `P_PAY_OPEN_API_KYB_DOCUMENT_REJECTED` | A document was rejected or a required field is missing. |
        | `P_PAY_OPEN_API_KYB_SUBJECT_TYPE_CONFLICT` | Another subject type already exists for this `userId`. |
        | `P_PAY_OPEN_API_KYB_MANUAL_REVIEW_REQUIRED` | Additional review is required; do not resubmit with altered details. |
        | `P_PAY_OPEN_API_KYB_SUBJECT_NOT_FOUND` | No matching company record was found. |
      operationId: institutionDepositAccountCreate
      parameters:
        - $ref: '#/components/parameters/Timestamp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
                  description: Sub-account UUID.
                channel:
                  type: string
                  description: Channel. Currently only `bridge` is supported.
                  example: bridge
                signedAgreementId:
                  type: string
                  description: For `tosMode = HOSTED_LINK`.
                acceptedTerms:
                  type: boolean
                  description: For `tosMode = INLINE_ACCEPT`.
                termsVersion:
                  type: string
                  description: For `tosMode = INLINE_ACCEPT`.
                subject:
                  $ref: '#/components/schemas/KybFieldGroup'
                representatives:
                  type: array
                  items:
                    $ref: '#/components/schemas/KybRepresentative'
                documents:
                  type: array
                  description: Provide all required documents in full every time.
                  items:
                    $ref: '#/components/schemas/KybDocument'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            description: "Onboarding status: `NOT_CREATED` / `SUBMITTED` / `IN_REVIEW` / `ACTION_REQUIRED` / `APPROVED` / `REJECTED`."
                            enum: [NOT_CREATED, SUBMITTED, IN_REVIEW, ACTION_REQUIRED, APPROVED, REJECTED]
                            example: IN_REVIEW
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v2/institution/wire/deposit/account:
    get:
      tags: [KYB]
      summary: Get deposit-account onboarding status
      description: |
